        }

<nav>

  <div class="container">
    <h1>Video Search</h1>
    <input type="text" id="searchInput" placeholder="Search videos...">
    <button id="searchButton">Search</button>
    <ul id="videoList"></ul>
	<script>
    const videos = [
      {
        title: "motivational video",
        description: "Motivation about studies.",
        thumbnail: "a.mp4" 
      },
      {
        title: "Attitude",
        description: "Lion attitude video.",
        thumbnail: "b.mp4"
      },
      {
        title: "Natural beauty",
        description: "Look how beautiful is our nature.",
        thumbnail: "c.mp4"
      }
    ];

    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const videoList = document.getElementById('videoList');

    searchButton.addEventListener('click', () => {
      const query = searchInput.value.toLowerCase();
      videoList.innerHTML = ''; // Clear previous results

      const results = videos.filter(video => {
        return video.title.toLowerCase().includes(query) 
               || video.description.toLowerCase().includes(query);
      });

      results.forEach(video => {
        const listItem = document.createElement('li');
        const thumbnail = document.createElement('Video');
        thumbnail.classList.add('video-thumbnail');
        thumbnail.src = video.thumbnail;
        listItem.appendChild(thumbnail);
        listItem.appendChild(document.createTextNode(video.title));
        videoList.appendChild(listItem);
      });
    });
  </script>
