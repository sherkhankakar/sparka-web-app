        function nextVideo() {
            // Logic to handle the next video
            // For example, you could:
            // 1. Get the current video source
            // 2. Determine the source for the next video (e.g., from an array of video sources)
            // 3. Update the video source in the HTML
            // 4. Optionally, reset video playback
            // 
            // Here's a simplified example:
            var videoSources = ["a.mp4", "b.mp4", "c.mp4"]; // Array of video sources
            var currentVideoIndex = 0; // Assuming "a.mp4" is the first video

            function getNextVideoSource() {
                currentVideoIndex = (currentVideoIndex + 1) % videoSources.length; 
                return videoSources[currentVideoIndex];
            }

            var videoElement = document.querySelector('video');
            videoElement.src = getNextVideoSource();
            videoElement.load(); // Reload the video
        }

	<script>
        function shareOnFacebook() {
            var videoUrl = "a.mp4"; 
            var shareUrl = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(videoUrl);

	<script>
        const commentsSection = document.querySelector('.comments-section');
        const commentInput = document.querySelector('.comment-input');
        const commentList = document.querySelector('.comment-list');

        function toggleComments() {
            commentsSection.style.display = 
                commentsSection.style.display === 'none' ? 'block' : 'none';
        }

        function addComment() {
            const commentText = commentInput.value;
            if (commentText.trim() === '') return; 

            const li = document.createElement('li');
            li.classList.add('comment-item');
            li.textContent = commentText;

            commentList.appendChild(li);
            commentInput.value = ''; 
        }
    </script>
