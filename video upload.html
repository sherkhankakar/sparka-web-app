<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>	
	body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 0;
}

h2 {
    color: #333;
}

.login-container, .dashboard-container, .upload-container {
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
    background-color: white;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

input[type="text"], input[type="password"], input[type="file"] {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #45a049;
}

a {
    display: block;
    text-align: center;
    color: #4CAF50;
    text-decoration: none;
    margin-top: 20px;
}

a:hover {
    text-decoration: underline;
}
/* Basic CSS styling - customize as needed */
        nav {
            background-color: #333;
            overflow: hidden;
        }

        nav a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }
	</style>
</head>
<body>
	<nav>
        <a href="loggin.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="video upload.html">Video upload</a>
    </nav>
    <div class="upload-container">
        <h2>Upload a Video</h2>
        <form method="POST" enctype="multipart/form-data">
            <label for="video">Choose a video</label>
            <input type="file" name="video" accept="a.mp4" required>
            <button type="submit">Upload</button>
        </form>
    </div>
</body>
</html>
